<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 · Tank Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c222b; --border:#30363d;
    --text:#e8e8e8; --accent:#ffd23f; --dim:#8b949e; --danger:#ff5a5a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #1a2230 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Press Start 2P','Courier New',monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 40px; user-select:none; -webkit-user-select:none;
  }
  h1{ font-size:22px; letter-spacing:2px; margin:0 0 6px; color:var(--accent); text-shadow:0 0 12px rgba(255,210,63,.35); }
  .sub{ font-size:9px; color:var(--dim); letter-spacing:1px; margin-bottom:16px; }

  #hud{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%;
    max-width:560px; margin-bottom:12px;
  }
  .stat{
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:8px 12px; font-size:9px; color:var(--dim); min-width:88px; text-align:center;
  }
  .stat b{ display:block; font-size:14px; color:var(--text); margin-top:4px; }
  .stat .val{ display:block; font-size:15px; color:var(--accent); margin-top:4px; }

  #stage{
    position:relative; width:min(560px, 94vw); aspect-ratio:1/1;
    border:3px solid var(--border); border-radius:8px; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 0 1px #000 inset;
    background:#05070a;
  }
  canvas{
    width:100%; height:100%; display:block; image-rendering:pixelated; background:#05070a;
  }

  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:12px;
    background:rgba(5,7,10,.86); z-index:5; padding:20px;
  }
  .overlay h2{ font-size:20px; margin:0; color:var(--accent); letter-spacing:2px; text-shadow:0 0 14px rgba(255,210,63,.5); }
  .overlay h2.red{ color:var(--danger); text-shadow:0 0 14px rgba(255,90,90,.5); }
  .overlay p{ font-size:9px; line-height:2; color:var(--text); margin:0; max-width:420px; }
  .overlay .dim{ color:var(--dim); }
  .overlay .big{ font-size:13px; color:var(--accent); }
  .key{ display:inline-block; background:var(--panel2); border:1px solid var(--border); border-bottom-width:3px;
        border-radius:4px; padding:4px 7px; font-size:8px; color:var(--text); }
  .hidden{ display:none !important; }
  .blink{ animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  #touch{ display:none; }
  body.touch #touch{
    display:flex; margin-top:18px; gap:26px; align-items:center;
  }
  .dpad{ display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:4px; }
  .dpad button,.fire{
    border:2px solid var(--border); background:rgba(28,34,43,.9); color:var(--text);
    border-radius:8px; font-size:18px; cursor:pointer; touch-action:none;
  }
  .dpad button:active,.fire:active{ background:var(--accent); color:#000; }
  .dpad .up{ grid-column:2; grid-row:1; }
  .dpad .left{ grid-column:1; grid-row:2; }
  .dpad .right{ grid-column:3; grid-row:2; }
  .dpad .down{ grid-column:2; grid-row:3; }
  .fire{ width:88px; height:88px; border-radius:50%; font-size:11px; color:var(--danger); }

  footer{ margin-top:16px; font-size:8px; color:var(--dim); line-height:1.9; text-align:center; }
  @media (max-width:520px){ h1{ font-size:18px; } .stat{ min-width:70px; padding:6px 8px; } }
</style>
</head>
<body>
  <h1>TANK BATTLE</h1>
  <div class="sub">坦 克 大 战</div>

  <div id="hud">
    <div class="stat">得分 SCORE<b id="score" class="val">0</b></div>
    <div class="stat">最高 HI<b id="hi" class="val">0</b></div>
    <div class="stat">关卡 LEVEL<b id="level" class="val">1</b></div>
    <div class="stat">生命 LIVES<b id="lives" class="val">3</b></div>
    <div class="stat">剩余 LEFT<b id="left" class="val">0</b></div>
  </div>

  <div id="stage">
    <canvas id="game" width="520" height="520"></canvas>

    <div id="ov-start" class="overlay">
      <h2>TANK BATTLE</h2>
      <p>保卫你的基地，消灭所有敌方坦克！</p>
      <p class="dim">
        移动 <span class="key">WASD</span> / <span class="key">方向键</span><br>
        射击 <span class="key">SPACE</span> / <span class="key">J</span><br>
        暂停 <span class="key">P</span> · 静音 <span class="key">M</span>
      </p>
      <p class="big blink">按 ENTER 开始</p>
    </div>

    <div id="ov-pause" class="overlay hidden">
      <h2>已暂停</h2>
      <p class="big blink">按 P 或 ENTER 继续</p>
    </div>

    <div id="ov-clear" class="overlay hidden">
      <h2>关卡完成!</h2>
      <p id="clear-txt" class="big">准备进入下一关...</p>
    </div>

    <div id="ov-over" class="overlay hidden">
      <h2 class="red" id="over-title">GAME OVER</h2>
      <p id="over-txt" class="big">基地被摧毁了</p>
      <p id="over-score" class="dim">得分 0</p>
      <p class="big blink">按 ENTER 重新开始</p>
    </div>
  </div>

  <div id="touch">
    <div class="dpad">
      <button class="up"    data-dir="0">▲</button>
      <button class="left"  data-dir="3">◀</button>
      <button class="right" data-dir="1">▶</button>
      <button class="down"  data-dir="2">▼</button>
    </div>
    <button class="fire">开火</button>
  </div>

  <footer>
    消灭所有敌人过关 · 别让敌人摧毁你的基地<br>
    打碎砖墙 · 星星可强化炮弹 · 拾取道具获得加成
  </footer>

<script>
'use strict';
/* ============================ 常量 ============================ */
const TILE = 20, COLS = 26, ROWS = 26;
const W = COLS * TILE, H = ROWS * TILE;
const TANK = TILE * 2;                       // 坦克边长 40
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, BASE = 4, TREE = 5;
const DX = [0, 1, 0, -1];                    // 0上 1右 2下 3左
const DY = [-1, 0, 1, 0];

const MAP_STRINGS = [
  "..........................",
  "..........................",
  "..........................",
  "..###.###........###.###..",
  "..#**.###........###.**#..",
  "..#**@@............@@**#..",
  "..###@@..###..###..@@###..",
  ".........###@@###.........",
  ".##..###..........###..##.",
  ".##.......@@..@@.......##.",
  ".##.......@@..@@.......##.",
  "....~~~~~~......~~~~~~....",
  "....~~~**~......~**~~~....",
  ".*.....**........**.....*.",
  ".*###.###........###.###*.",
  ".*###.###.##..##.###.###*.",
  "..###.###*##..##*###.###..",
  ".........*##..##*.........",
  "..........##..##..........",
  ".........###..###.........",
  "....###..###..###..###....",
  "....###............###....",
  "..........................",
  "...........####...........",
  "...........#BB#...........",
  "...........#BB#...........",
];
const CH2TILE = { '.':0, '#':1, '@':2, '~':3, 'B':4, '*':5 };

const ENEMY_TYPES = {
  basic: { hp:1, speed:58,  fireMin:1600, fireMax:3000, color:'#c9c9d0', dark:'#6b6b72', score:100 },
  fast:  { hp:1, speed:95,  fireMin:1200, fireMax:2300, color:'#5fa8ff', dark:'#2a4f8f', score:200 },
  power: { hp:1, speed:60,  fireMin:850,  fireMax:1500, color:'#ff9c3f', dark:'#8f4b12', score:300 },
  armor: { hp:3, speed:52,  fireMin:1500, fireMax:2700, color:'#6fdb82', dark:'#2f7a3a', score:400, powerup:true },
};
const POWERUP_WEIGHTS = [ ['life',3], ['shield',3], ['rapid',3], ['grenade',1] ];

/* ============================ 画布 / DOM ============================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const elScore = $('score'), elHi = $('hi'), elLevel = $('level'), elLives = $('lives'), elLeft = $('left');

/* ============================ 游戏状态 ============================ */
let grid = parseMap(MAP_STRINGS), player, enemies = [], bullets = [], powerups = [], particles = [];
let phase = 'menu';               // menu | playing | paused | levelclear | gameoverPending | gameover
let score = 0, lives = 3, level = 1, high = 0;
let spawnQueue = [], spawnTimer = 0;
let clearTimer = 0, overTimer = 0;
let time = 0;

try { high = parseInt(localStorage.getItem('tank-high') || '0', 10) || 0; } catch(e){}

/* ============================ 地图 ============================ */
function parseMap(rows){
  return rows.map(r => r.split('').map(c => CH2TILE[c]));
}
function isSolid(t){ return t === BRICK || t === STEEL || t === WATER || t === BASE; }

/* ============================ 输入 ============================ */
const heldDirs = [];              // 按下的方向栈（后按优先）
let firing = false;
const DIR_KEYS = {
  ArrowUp:0, KeyW:0, ArrowRight:1, KeyD:1, ArrowDown:2, KeyS:2, ArrowLeft:3, KeyA:3
};

function pushDir(d){ if(!heldDirs.includes(d)) heldDirs.push(d); }
function dropDir(d){ const i = heldDirs.indexOf(d); if(i >= 0) heldDirs.splice(i, 1); }

window.addEventListener('keydown', e => {
  if(e.repeat) return;
  initAudio();
  const code = e.code;
  if(code in DIR_KEYS){ pushDir(DIR_KEYS[code]); e.preventDefault(); }
  else if(code === 'Space' || code === 'KeyJ'){ firing = true; e.preventDefault(); }
  else if(code === 'KeyP' || code === 'Escape'){ togglePause(); e.preventDefault(); }
  else if(code === 'KeyM'){ muted = !muted; e.preventDefault(); }
  else if(code === 'Enter'){
    if(phase === 'menu' || phase === 'gameover') resetGame();
    else if(phase === 'paused') togglePause();
  }
});
window.addEventListener('keyup', e => {
  const code = e.code;
  if(code in DIR_KEYS){ dropDir(DIR_KEYS[code]); e.preventDefault(); }
  else if(code === 'Space' || code === 'KeyJ'){ firing = false; e.preventDefault(); }
});
window.addEventListener('blur', () => { heldDirs.length = 0; firing = false; });

/* 触摸控制 */
if('ontouchstart' in window){ document.body.classList.add('touch'); }
document.querySelectorAll('.dpad button').forEach(btn => {
  const d = parseInt(btn.dataset.dir, 10);
  btn.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); pushDir(d); });
  btn.addEventListener('pointerup',   () => dropDir(d));
  btn.addEventListener('pointerleave',() => dropDir(d));
  btn.addEventListener('pointercancel',() => dropDir(d));
});
const fireBtn = document.querySelector('.fire');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); firing = true; });
fireBtn.addEventListener('pointerup', () => firing = false);
fireBtn.addEventListener('pointerleave', () => firing = false);
fireBtn.addEventListener('pointercancel', () => firing = false);

/* ============================ 音效 ============================ */
let audio = null, muted = false;
function initAudio(){
  if(audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function tone(f0, f1, dur, type, vol){
  if(!audio || muted) return;
  try{
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(f0,1), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function noise(dur, vol){
  if(!audio || muted) return;
  try{
    const t = audio.currentTime, n = Math.max(1, Math.floor(audio.sampleRate * dur));
    const buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = audio.createBufferSource(); s.buffer = buf;
    const g = audio.createGain(); g.gain.value = vol || 0.2;
    const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    s.connect(f); f.connect(g); g.connect(audio.destination); s.start(t);
  }catch(e){}
}
const SFX = {
  shoot(){ tone(760, 320, 0.07, 'square', 0.05); },
  hit(){ tone(240, 120, 0.09, 'sawtooth', 0.09); },
  brick(){ noise(0.07, 0.10); },
  boom(){ noise(0.28, 0.28); tone(140, 35, 0.25, 'triangle', 0.14); },
  big(){ noise(0.6, 0.4); tone(90, 25, 0.5, 'triangle', 0.2); },
  power(){ tone(523,523,0.08,'square',0.08); setTimeout(()=>tone(659,659,0.08,'square',0.08),80); setTimeout(()=>tone(784,784,0.12,'square',0.08),160); },
  life(){ tone(440,880,0.18,'square',0.09); },
  clear(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.12,'square',0.09), i*110)); },
};

/* ============================ 工具 ============================ */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rectBlocked(x, y, w, h){
  const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.01) / TILE);
  const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.01) / TILE);
  for(let ty = y0; ty <= y1; ty++) for(let tx = x0; tx <= x1; tx++){
    if(tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
    if(isSolid(grid[ty][tx])) return true;
  }
  return false;
}
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function tankHitbox(t){ return { x:t.x, y:t.y, w:TANK, h:TANK }; }
function tanksTouch(a, b){ return overlap(tankHitbox(a), tankHitbox(b)); }

/* ============================ 粒子 ============================ */
function spawnBurst(x, y, color, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 140;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.35 + Math.random() * 0.4, max: 0.75, size: 2 + Math.random() * 3,
      color: Math.random() < 0.4 ? '#fff' : color
    });
  }
}
function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ============================ 游戏流程 ============================ */
function resetGame(){
  score = 0; lives = 3; level = 1;
  startLevel(1);
}
function startLevel(lv){
  level = lv;
  grid = parseMap(MAP_STRINGS);
  bullets = []; powerups = []; enemies = []; particles = [];
  spawnQueue = buildWave(lv); spawnTimer = 1.0;
  player = makePlayer();
  phase = 'playing';
  updateHUD();
}
function makePlayer(){
  return {
    x: 8 * TILE, y: 24 * TILE, dir: 0, speed: 95,
    cooldown: 0, invulnUntil: time + 2, upgrade: false
  };
}
function buildWave(lv){
  const total = Math.min(9 + lv * 2, 20), q = [];
  for(let i = 0; i < total; i++) q.push(pickType(lv));
  return q;
}
function pickType(lv){
  const r = Math.random();
  if(lv >= 3 && r < 0.15) return 'armor';
  if(lv >= 2 && r < 0.33) return 'power';
  if(r < 0.62) return 'basic';
  return 'fast';
}
function spawnEnemy(){
  const spots = [{x:0,y:0},{x:12,y:0},{x:24,y:0}];
  const free = spots.filter(s => !enemies.some(e => Math.abs(e.x - s.x*TILE) < 20 && Math.abs(e.y - s.y*TILE) < 20));
  const s = free.length ? free[Math.floor(Math.random()*free.length)] : spots[0];
  const type = spawnQueue.shift(), t = ENEMY_TYPES[type];
  const speed = t.speed * (1 + 0.05 * (level - 1));
  enemies.push({
    x: s.x * TILE, y: s.y * TILE, dir: 2, speed, type,
    hp: t.hp, maxHp: t.hp, fireMin: t.fireMin, fireMax: t.fireMax,
    color: t.color, dark: t.dark, score: t.score, powerup: !!t.powerup,
    fireTimer: 0.8 + Math.random() * 1.2, decideTimer: 0, hitFlash: 0, spawnTimer: 0.9
  });
}
function maxEnemiesOnField(){ return Math.min(3 + level, 6); }

function togglePause(){
  if(phase === 'playing'){ phase = 'paused'; $('ov-pause').classList.remove('hidden'); }
  else if(phase === 'paused'){ phase = 'playing'; $('ov-pause').classList.add('hidden'); }
}

function gameOver(reason){
  phase = 'gameoverPending'; overTimer = 1.6;
  $('over-title').textContent = 'GAME OVER';
  $('over-txt').textContent = reason === 'base' ? '基地被摧毁了' : '所有坦克都被击毁';
  $('over-score').textContent = '得分 ' + score + ' · 关卡 ' + level;
  if(score > high){ high = score; try{ localStorage.setItem('tank-high', String(high)); }catch(e){} }
  SFX.big();
}

/* ============================ 移动 / 碰撞 ============================ */
function tryMove(t, dir, dt, others){
  const nx = clamp(t.x + DX[dir] * t.speed * dt, 0, W - TANK);
  const ny = clamp(t.y + DY[dir] * t.speed * dt, 0, H - TANK);
  if(rectBlocked(nx, ny, TANK, TANK)) return false;
  for(const o of others){ if(o !== t && overlap({x:nx,y:ny,w:TANK,h:TANK}, tankHitbox(o))) return false; }
  t.x = nx; t.y = ny; return true;
}
function canDir(t, dir, others){
  const nx = clamp(t.x + DX[dir] * TILE, 0, W - TANK);
  const ny = clamp(t.y + DY[dir] * TILE, 0, H - TANK);
  if(rectBlocked(nx, ny, TANK, TANK)) return false;
  for(const o of others){ if(o !== t && overlap({x:nx,y:ny,w:TANK,h:TANK}, tankHitbox(o))) return false; }
  return true;
}

/* ============================ 玩家 ============================ */
function updatePlayer(dt){
  const p = player;
  p.cooldown -= dt;
  if(heldDirs.length){
    const dir = heldDirs[heldDirs.length - 1];
    p.dir = dir;
    tryMove(p, dir, dt, enemies);
  }
  const maxB = p.upgrade ? 2 : 1;
  const onField = bullets.filter(b => b.owner === 'player').length;
  if(firing && p.cooldown <= 0 && onField < maxB){
    fireBullet(p, 'player');
    p.cooldown = p.upgrade ? 0.16 : 0.28;
  }
}
function fireBullet(t, owner){
  const cx = t.x + TANK/2, cy = t.y + TANK/2;
  const b = { x: cx - 3, y: cy - 3, w: 6, h: 6, dir: t.dir,
              speed: (owner === 'player' && t.upgrade) ? 360 : 280,
              owner, upgraded: owner === 'player' && t.upgrade };
  b.x += DX[b.dir] * (TANK/2 + 2) - 3;
  b.y += DY[b.dir] * (TANK/2 + 2) - 3;
  bullets.push(b);
  if(owner === 'player') SFX.shoot();
}
function hitPlayer(){
  const p = player;
  if(p.invulnUntil > time) return;
  spawnBurst(p.x + TANK/2, p.y + TANK/2, '#ffd23f', 26);
  SFX.boom();
  lives--;
  if(lives <= 0){ lives = 0; updateHUD(); gameOver('lives'); return; }
  p.x = 8 * TILE; p.y = 24 * TILE; p.dir = 0; p.upgrade = false;
  p.invulnUntil = time + 2;
  updateHUD();
}

/* ============================ 敌人 ============================ */
function updateEnemies(dt){
  const others = enemies.concat([player]);
  for(const e of enemies){
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.fireTimer -= dt;
    if(e.spawnTimer > 0){
      e.spawnTimer -= dt;
      continue;
    }
    e.decideTimer -= dt;
    const moved = tryMove(e, e.dir, dt, others);
    if(!moved || e.decideTimer <= 0){
      e.dir = chooseDir(e, others);
      e.decideTimer = 0.8 + Math.random() * 1.6;
    }
    if(e.fireTimer <= 0 && bullets.filter(b => b.owner === 'enemy').length < 6){
      fireBullet(e, 'enemy');
      e.fireTimer = e.fireMin + Math.random() * (e.fireMax - e.fireMin);
    }
  }
}
function chooseDir(e, others){
  const reverse = (e.dir + 2) % 4;
  const opts = [];
  const add = (d, w) => { for(let i = 0; i < w; i++) opts.push(d); };
  if(canDir(e, e.dir, others)) add(e.dir, 3);
  if(canDir(e, 2, others)) add(2, 3);
  if(canDir(e, 1, others)) add(1, 2);
  if(canDir(e, 3, others)) add(3, 2);
  if(canDir(e, 0, others) && 0 !== reverse) add(0, 1);
  if(!opts.length){ for(let d = 0; d < 4; d++) if(canDir(e, d, others)) add(d, 1); }
  if(!opts.length) return e.dir;
  return opts[Math.floor(Math.random() * opts.length)];
}
function hitEnemy(e){
  if(e.spawnTimer > 0) return;
  e.hp--; e.hitFlash = 0.15;
  if(e.hp <= 0) destroyEnemy(e);
  else SFX.hit();
}
function destroyEnemy(e){
  spawnBurst(e.x + TANK/2, e.y + TANK/2, e.color, 22);
  SFX.boom();
  score += e.score;
  enemies.splice(enemies.indexOf(e), 1);
  if(e.powerup) dropPowerup(e.x + TANK/2, e.y + TANK/2);
  updateHUD();
}

/* ============================ 子弹 ============================ */
function updateBullets(dt){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += DX[b.dir] * b.speed * dt;
    b.y += DY[b.dir] * b.speed * dt;
    let dead = false;

    // 出界
    if(b.x < -8 || b.y < -8 || b.x > W + 2 || b.y > H + 2) dead = true;

    // 地形
    if(!dead){
      const px = b.x + 3 + DX[b.dir] * 3, py = b.y + 3 + DY[b.dir] * 3;
      const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
      if(tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS){
        const t = grid[ty][tx];
        if(t === BRICK){ grid[ty][tx] = EMPTY; spawnBurst(tx*TILE+10, ty*TILE+10, '#b0422f', 8); SFX.brick(); dead = true; }
        else if(t === STEEL){ if(b.upgraded){ grid[ty][tx] = EMPTY; spawnBurst(tx*TILE+10, ty*TILE+10, '#8b929b', 8); SFX.brick(); } dead = true; }
        else if(t === BASE){
          for(let yy = 0; yy < ROWS; yy++) for(let xx = 0; xx < COLS; xx++) if(grid[yy][xx] === BASE){ grid[yy][xx] = EMPTY; spawnBurst(xx*TILE+10, yy*TILE+10, '#ffd23f', 18); }
          SFX.big();
          gameOver('base');
          dead = true;
        }
      }
    }

    // 坦克
    if(!dead){
      if(b.owner === 'player'){
        for(const e of enemies){
          if(overlap(b, tankHitbox(e))){ hitEnemy(e); dead = true; break; }
        }
      } else {
        if(overlap(b, tankHitbox(player))){ hitPlayer(); dead = true; }
        else for(const e of enemies){
          if(overlap(b, tankHitbox(e))){ hitEnemy(e); dead = true; break; }
        }
      }
    }

    if(dead) bullets.splice(i, 1);
  }

  // 子弹相消
  for(let i = 0; i < bullets.length; i++){
    for(let j = i + 1; j < bullets.length; j++){
      if(bullets[i] && bullets[j] && bullets[i].owner !== bullets[j].owner && overlap(bullets[i], bullets[j])){
        spawnBurst(bullets[i].x + 3, bullets[i].y + 3, '#fff', 4);
        bullets.splice(j, 1); bullets.splice(i, 1);
        i--; break;
      }
    }
  }
}

/* ============================ 道具 ============================ */
const POWERUP_DEF = {
  life:   { color:'#ff5a7a', label:'♥' },
  shield: { color:'#5ad8ff', label:'盾' },
  rapid:  { color:'#ffd23f', label:'★' },
  grenade:{ color:'#c0c0c8', label:'爆' },
};
function dropPowerup(x, y){
  const keys = [];
  for(const [k, w] of POWERUP_WEIGHTS) for(let i = 0; i < w; i++) keys.push(k);
  const type = keys[Math.floor(Math.random() * keys.length)];
  const px = Math.floor(x / TILE) * TILE, py = Math.floor(y / TILE) * TILE;
  powerups.push({ x: px, y: py, w: TILE, h: TILE, type, life: 10, blink: 0 });
}
function updatePowerups(dt){
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.life -= dt;
    if(p.life <= 0){ powerups.splice(i, 1); continue; }
    if(overlap(p, tankHitbox(player))){ collect(p); powerups.splice(i, 1); }
  }
}
function collect(p){
  SFX.power();
  switch(p.type){
    case 'life': lives = Math.min(lives + 1, 5); SFX.life(); break;
    case 'shield': player.invulnUntil = time + 8; break;
    case 'rapid': player.upgrade = true; break;
    case 'grenade':
      for(const e of enemies.slice()){ spawnBurst(e.x + TANK/2, e.y + TANK/2, e.color, 22); score += e.score; }
      SFX.boom(); enemies.length = 0;
      break;
  }
  updateHUD();
}

/* ============================ 主循环 ============================ */
function update(dt){
  time += dt;
  updateParticles(dt);

  if(phase === 'playing'){
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePowerups(dt);

    // 生成敌人
    if(spawnQueue.length && enemies.length < maxEnemiesOnField()){
      spawnTimer -= dt;
      if(spawnTimer <= 0){ spawnEnemy(); spawnTimer = 0.9; }
    }

    // 过关
    if(!spawnQueue.length && !enemies.length && !bullets.some(b => b.owner === 'enemy')){
      phase = 'levelclear'; clearTimer = 2.2;
      $('clear-txt').textContent = '得分 ' + score + ' · 即将进入第 ' + (level + 1) + ' 关';
      $('ov-clear').classList.remove('hidden');
      SFX.clear();
    }
  }
  else if(phase === 'levelclear'){
    clearTimer -= dt;
    if(clearTimer <= 0){ $('ov-clear').classList.add('hidden'); startLevel(level + 1); }
  }
  else if(phase === 'gameoverPending'){
    overTimer -= dt;
    if(overTimer <= 0){ phase = 'gameover'; $('ov-over').classList.remove('hidden'); }
  }
  updateHUD();
}

function updateHUD(){
  elScore.textContent = score;
  elHi.textContent = high;
  elLevel.textContent = level;
  elLives.textContent = lives;
  elLeft.textContent = spawnQueue.length + enemies.length;
}

/* ============================ 渲染 ============================ */
function drawTile(x, y, t){
  const px = x * TILE, py = y * TILE;
  switch(t){
    case BRICK:
      ctx.fillStyle = '#6d241e'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#b0422f'; ctx.fillRect(px + 1, py + 1, TILE - 2, 8);
      ctx.fillRect(px + 1, py + 11, TILE - 2, 8);
      ctx.fillStyle = '#d05a44'; ctx.fillRect(px + 1, py + 1, TILE - 2, 2);
      ctx.fillRect(px + 1, py + 11, TILE - 2, 2);
      break;
    case STEEL:
      ctx.fillStyle = '#5c646d'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#aeb6bf'; ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      ctx.fillStyle = '#d3d9df'; ctx.fillRect(px + 2, py + 2, TILE - 4, 2);
      ctx.fillRect(px + 2, py + 2, 2, TILE - 4);
      ctx.fillStyle = '#7d858e'; ctx.fillRect(px + 2, py + TILE - 4, TILE - 4, 2);
      ctx.fillRect(px + TILE - 4, py + 2, 2, TILE - 4);
      break;
    case WATER:
      ctx.fillStyle = '#1c4a85'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#2f6fbf';
      const off = Math.floor(time * 3) % TILE;
      ctx.fillRect(px + off - TILE, py + 3, 12, 4);
      ctx.fillRect(px + off, py + 3, 12, 4);
      ctx.fillStyle = '#3f86d6';
      ctx.fillRect(px + off - TILE + 6, py + 12, 10, 4);
      ctx.fillRect(px + off + 6, py + 12, 10, 4);
      break;
    case BASE:
      ctx.fillStyle = '#3a3f46'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#565d66'; ctx.fillRect(px + 2, py + 9, TILE - 4, 9);
      break;
  }
}

function drawEagle(){
  let x0 = COLS, y0 = ROWS, x1 = -1, y1 = -1;
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++) if(grid[y][x] === BASE){
    if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
  }
  if(x0 > x1) return;
  const cx = (x0 + x1 + 1) * TILE / 2, cy = (y0 + y1 + 1) * TILE / 2;
  const s = Math.min((x1 - x0 + 1), (y1 - y0 + 1)) * TILE;
  ctx.save();
  ctx.translate(cx, cy);
  // 金色鹰徽
  ctx.fillStyle = '#f5c542';
  ctx.beginPath();
  ctx.moveTo(-s*0.42, s*0.26);
  ctx.lineTo(-s*0.16, -s*0.10);
  ctx.lineTo(0, -s*0.30);
  ctx.lineTo(s*0.16, -s*0.10);
  ctx.lineTo(s*0.42, s*0.26);
  ctx.lineTo(s*0.16, s*0.04);
  ctx.lineTo(0, s*0.16);
  ctx.lineTo(-s*0.16, s*0.04);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#8a6a10'; ctx.lineWidth = 1.5; ctx.stroke();
  // 头部
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath(); ctx.arc(0, -s*0.26, s*0.10, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawTank(t, flash){
  ctx.save();
  ctx.translate(t.x + TANK/2, t.y + TANK/2);
  ctx.rotate(t.dir * Math.PI / 2);
  const body = flash ? '#ffffff' : t.color;
  const dark = flash ? '#ffffff' : t.dark;
  // 履带
  ctx.fillStyle = '#24262b';
  ctx.fillRect(-18, -18, 8, 36);
  ctx.fillRect(10, -18, 8, 36);
  ctx.fillStyle = '#3c4048';
  for(let i = -16; i <= 16; i += 8){ ctx.fillRect(-17, i, 6, 4); ctx.fillRect(11, i, 6, 4); }
  // 车身
  ctx.fillStyle = body;
  ctx.fillRect(-11, -16, 22, 32);
  ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.strokeRect(-11, -16, 22, 32);
  // 炮塔
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(0, -4, 6, 0, Math.PI * 2); ctx.fill();
  // 炮管
  ctx.fillStyle = dark;
  ctx.fillRect(-2.5, -21, 5, 12);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(-8, -13, 5, 26);
  ctx.restore();
}

function drawPowerup(p){
  const d = POWERUP_DEF[p.type];
  if(p.life < 3 && Math.floor(p.life * 4) % 2 === 0) return; // 闪烁
  const cx = p.x + 10, cy = p.y + 10;
  ctx.save();
  ctx.fillStyle = 'rgba(10,12,16,.75)';
  ctx.fillRect(p.x, p.y, TILE, TILE);
  ctx.strokeStyle = d.color; ctx.lineWidth = 2;
  ctx.strokeRect(p.x + 1, p.y + 1, TILE - 2, TILE - 2);
  ctx.fillStyle = d.color;
  if(p.type === 'life'){ // 心形
    ctx.beginPath();
    ctx.moveTo(cx, cy + 4);
    ctx.bezierCurveTo(cx - 7, cy - 2, cx - 3, cy - 6, cx, cy - 1);
    ctx.bezierCurveTo(cx + 3, cy - 6, cx + 7, cy - 2, cx, cy + 4);
    ctx.fill();
  } else if(p.type === 'grenade'){
    ctx.beginPath(); ctx.arc(cx, cy + 1, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(cx - 1, cy - 9, 2, 4);
  } else if(p.type === 'rapid'){
    ctx.font = '13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', cx, cy + 1);
  } else { // shield
    ctx.beginPath();
    ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 6, cy - 4); ctx.lineTo(cx + 6, cy + 1);
    ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 6, cy + 1); ctx.lineTo(cx - 6, cy - 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0, 0, W, H);
  // 背景网格
  ctx.fillStyle = '#07090c'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.025)'; ctx.lineWidth = 1;
  for(let i = 1; i < COLS; i++){ ctx.beginPath(); ctx.moveTo(i*TILE,0); ctx.lineTo(i*TILE,H); ctx.stroke(); }
  for(let i = 1; i < ROWS; i++){ ctx.beginPath(); ctx.moveTo(0,i*TILE); ctx.lineTo(W,i*TILE); ctx.stroke(); }

  // 地砖（不含树）
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    const t = grid[y][x];
    if(t !== EMPTY && t !== TREE) drawTile(x, y, t);
  }
  drawEagle();

  // 道具
  for(const p of powerups) drawPowerup(p);

  // 坦克
  for(const e of enemies) drawTank(e, e.hitFlash > 0 || (e.spawnTimer > 0 && Math.floor(time*12) % 2 === 0));
  if(phase !== 'menu' && phase !== 'gameover'){
    const flash = (player.invulnUntil > time) && (Math.floor(time * 12) % 2 === 0);
    drawTank(player, flash);
    if(player.invulnUntil > time && !flash){ // 护盾环
      ctx.save(); ctx.strokeStyle = '#5ad8ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x + TANK/2, player.y + TANK/2, 25, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    }
  }

  // 树（覆盖坦克，制造隐藏效果）
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++) if(grid[y][x] === TREE) drawTree(x, y);

  // 子弹
  for(const b of bullets){
    ctx.fillStyle = b.owner === 'player' ? '#fff' : '#ff6b6b';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.upgraded ? '#ffd23f' : (b.owner === 'player' ? '#ffd23f' : '#ffd23f');
    ctx.fillRect(b.x + 1.5, b.y + 1.5, 3, 3);
  }

  drawParticles();
}

function drawTree(x, y){
  const px = x * TILE, py = y * TILE;
  ctx.fillStyle = '#5a3b1e'; ctx.fillRect(px + 8, py + 13, 4, 6);
  ctx.fillStyle = '#2f7d32';
  ctx.beginPath(); ctx.moveTo(px + 10, py + 2); ctx.lineTo(px + 3, py + 12); ctx.lineTo(px + 17, py + 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a9440';
  ctx.beginPath(); ctx.moveTo(px + 10, py - 1); ctx.lineTo(px + 5, py + 7); ctx.lineTo(px + 15, py + 7); ctx.closePath(); ctx.fill();
}

/* ============================ 启动 ============================ */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000; last = now;
  if(dt > 0.033) dt = 0.033;
  if(phase !== 'menu') update(dt);
  else updateParticles(dt);
  render();
  requestAnimationFrame(loop);
}
updateHUD();
requestAnimationFrame(loop);
</script>
</body>
